version: "3.7"
services: 
    app:
        build: 
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - 8080:8080
        restart: always
        environment:
            SERVER_CONTEXT_PATH: /spring-boot-demo
        depends_on:
            - db
    
    db:
        image: mysql:5.7
        restart: always
        volumes:
        - ./mysql-data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: backend